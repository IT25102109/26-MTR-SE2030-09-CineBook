# === CineBook Backend Configuration ===

# Server
server.port=8080

# --- Database (MySQL) ---
# Create a local database first: CREATE DATABASE cinebook_db;
spring.datasource.url=jdbc:mysql://localhost:8889/cinebook_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = keep data, auto-adjust schema based on entities (fine for dev)
# create-drop = wipe and recreate schema every restart (use if you want a clean slate each run)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Logging ---
logging.level.org.springframework=INFO
logging.level.com.cinebook=DEBUG

# --- Real Email OTP Configuration (Gmail SMTP / SendGrid / Custom SMTP) ---
# To send real emails via Gmail:
# 1. Enable 2-Step Verification in your Google Account
# 2. Generate an "App Password" at https://myaccount.google.com/apppasswords
# 3. Put your Gmail in username and the 16-letter App Password in password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CINEBOOK_MAIL_USERNAME:cinebook.notification@gmail.com}
spring.mail.password=${CINEBOOK_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Real SMS OTP Configuration (Twilio Gateway) ---
# To send real cellular SMS:
# 1. Sign up at https://www.twilio.com (free trial available)
# 2. Get Account SID, Auth Token, and a Twilio Phone Number
cinebook.sms.twilio.enabled=${CINEBOOK_TWILIO_ENABLED:false}
cinebook.sms.twilio.account-sid=${CINEBOOK_TWILIO_SID:}
cinebook.sms.twilio.auth-token=${CINEBOOK_TWILIO_AUTH_TOKEN:}
cinebook.sms.twilio.from-phone=${CINEBOOK_TWILIO_FROM:}
