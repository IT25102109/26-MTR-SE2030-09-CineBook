# === CineBook Backend Configuration ===

# Server
server.port=8080

# --- Database (MySQL) ---
# Create a local database first: CREATE DATABASE cinebook_db;
spring.datasource.url=jdbc:mysql://localhost:3306/cinebook_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = keep data, auto-adjust schema based on entities (fine for dev)
# create-drop = wipe and recreate schema every restart (use if you want a clean slate each run)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Logging ---
logging.level.org.springframework=INFO
logging.level.com.cinebook=DEBUG
